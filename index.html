<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page title/description/canonical/social tags + structured data.
         The build rewrites everything between these markers for each public
         page (src/seo/site.js, vite.config.js) and keeps them in step at
         runtime (src/seo/RouteSeo.jsx). Keep both markers. -->
    <!--seo:start-->
    <title>Fifth Avenue | Influencer Marketing Agency in India</title>
    <meta name="description" content="Fifth Avenue is a full-service marketing agency in India — influencer and regional creator campaigns, AI search (AEO), SEO and performance marketing on one live dashboard." />
    <!--seo:end-->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0d0f" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // one. Mirrors ThemeContext: an explicit choice wins, otherwise follow
      // the OS. Keep the key in sync with THEME_KEY in context/ThemeContext.jsx.
      try {
        var t = localStorage.getItem("5av_theme");
        if (t !== "light" && t !== "dark")
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
